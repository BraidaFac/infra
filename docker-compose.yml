services:
  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - app_network

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  suit_sonia:
    image: druga98/suit:latest
    restart: always
    env_file:
      - .s.env
    depends_on:
      - db
    networks:
      - app_network

  mutual_be:
    image: druga98/mutual_be:latest
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .m.env
    depends_on:
      - db
    networks:
      - app_network

  el_estribo_be:
    image: druga98/el_estribo_be:latest
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .e.env
    depends_on:
      - db
    networks:
      - app_network

  casa_sonia_compras:
    image: druga98/casa_sonia_compras:latest
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .csc.env
    depends_on:
      - db
    networks:
      - app_network
    volumes:
      - casa_sonia_uploads:/app/public/uploads
volumes:
  db_data:
    external: true
  npm_data:
  npm_letsencrypt:
  casa_sonia_uploads:

networks:
  app_network:
    driver: bridge
